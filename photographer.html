<!doctype html>
<html lang="fr">
   <head>
      <link href="css/style.css" rel="stylesheet" type="text/css" />
      <meta charset="utf-8" />
      <link rel="icon" type="image/png" href="assets/favicon.png" />
      <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet" />
      <title>Fisheye - photographe</title>
   </head>
   <body>
      <header class="header" aria-hidden="false">
         <a href="index.html" aria-label="Fisheye Home page"><img src="assets/images/logo.png" class="logo" alt="fisheye logo" /></a>
      </header>
      <main id="main" aria-hidden="false">
         <div class="photograph-header"></div>
         <div class="sort-menu">
            <label for="sort-select" id="sort-label">Trier par</label>
            <!-- Select personnalisé -->
            <div class="custom-select" id="customSelect">
               <button class="select-button" id="selectButton" 
                       aria-haspopup="listbox" 
                       aria-expanded="false"
                       aria-labelledby="sort-label"
                       tabindex="0">
                   <span class="selected-text">Popularité</span>
                   <div class="select-arrow"></div>
               </button>
               <div class="select-dropdown" 
                    id="selectDropdown"
                    role="listbox"
                    aria-labelledby="sort-label">
                   <div class="select-option selected" 
                        data-value="popularity" 
                        role="option"
                        aria-selected="true"
                        tabindex="-1">Popularité</div>
                   <div class="select-option" 
                        data-value="date" 
                        role="option"
                        aria-selected="false"
                        tabindex="-1">Date</div>
                   <div class="select-option" 
                        data-value="title" 
                        role="option"
                        aria-selected="false"
                        tabindex="-1">Titre</div>
               </div>
           </div>
           <!-- Fin du select personnalisé -->
            </div>
            <select class="native-select" id="sort-select" name="sort">
               <option value="popularity">Popularité</option>
               <option value="date">Date</option>
               <option value="title">Titre</option>
            </select>
         </div>
         <div class="photograph-media"></div>
      </main>
      <script type="module" src="/scripts/pages/photographer.js"></script>
      <script type="module" src="/scripts/controllers/modalController.js"></script>
      <script type="module" src="/scripts/controllers/dropdownController.js"></script>
      <script src="https://kit.fontawesome.com/b3f7717dd0.js" crossorigin="anonymous"></script>
   </body>
</html>
